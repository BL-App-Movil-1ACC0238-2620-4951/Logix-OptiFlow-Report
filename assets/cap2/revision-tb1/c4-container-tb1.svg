<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img"><title>C4 · Nivel 2 · Contenedores de OptiFlow hasta TB1</title><desc>Un único contenedor backend Spring Boot, aplicación móvil, landing y persistencia relacional.</desc>
