<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img"><title>Clinical &amp; Commercial · Modelo de persistencia</title><desc>Esquema respaldado por la migración V2: cotización a venta uno a cero o uno.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#12364a">Clinical &amp; Commercial · Modelo de persistencia</text>
<rect x="45" y="110" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="63" y="145" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">clinical_records</text>
<text x="63" y="183" font-family="Arial,sans-serif" font-size="15" fill="#243b53">id UUID · PK</text>
<text x="63" y="214" font-family="Arial,sans-serif" font-size="15" fill="#243b53">patient_id UUID · NOT NULL</text>
<text x="63" y="245" font-family="Arial,sans-serif" font-size="15" fill="#243b53">appointment_id UUID · UNIQUE</text>
<text x="63" y="276" font-family="Arial,sans-serif" font-size="15" fill="#243b53">status: PENDING / OPEN / CLOSED</text>
<rect x="540" y="110" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="558" y="145" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">quotations</text>
<text x="558" y="183" font-family="Arial,sans-serif" font-size="15" fill="#243b53">id UUID · PK</text>
<text x="558" y="214" font-family="Arial,sans-serif" font-size="15" fill="#243b53">clinical_record_id UUID · FK</text>
<text x="558" y="245" font-family="Arial,sans-serif" font-size="15" fill="#243b53">status: DRAFT / APPROVED / REJECTED</text>
<text x="558" y="276" font-family="Arial,sans-serif" font-size="15" fill="#243b53">total y descuento</text>
<rect x="1035" y="110" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="1053" y="145" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">sales</text>
<text x="1053" y="183" font-family="Arial,sans-serif" font-size="15" fill="#243b53">id UUID · PK</text>
<text x="1053" y="214" font-family="Arial,sans-serif" font-size="15" fill="#243b53">quotation_id UUID · FK, NOT NULL, UNIQUE</text>
<text x="1053" y="245" font-family="Arial,sans-serif" font-size="15" fill="#243b53">patient_id UUID · NOT NULL</text>
<text x="1053" y="276" font-family="Arial,sans-serif" font-size="15" fill="#243b53">status y datos del pago</text>
<rect x="45" y="475" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="63" y="510" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">medical_histories</text>
<text x="63" y="548" font-family="Arial,sans-serif" font-size="15" fill="#243b53">clinical_record_id · PK y FK</text>
<text x="63" y="579" font-family="Arial,sans-serif" font-size="15" fill="#243b53">Antecedentes / alergias</text>
<text x="63" y="610" font-family="Arial,sans-serif" font-size="15" fill="#243b53">Cada registro tiene 0..1 historia</text>
<rect x="540" y="475" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="558" y="510" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">quotation_items</text>
<text x="558" y="548" font-family="Arial,sans-serif" font-size="15" fill="#243b53">id UUID · PK</text>
<text x="558" y="579" font-family="Arial,sans-serif" font-size="15" fill="#243b53">quotation_id · FK</text>
<text x="558" y="610" font-family="Arial,sans-serif" font-size="15" fill="#243b53">line_number · UNIQUE por cotización</text>
<text x="558" y="641" font-family="Arial,sans-serif" font-size="15" fill="#243b53">producto, cantidad y precio</text>
<rect x="1035" y="475" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="1053" y="510" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">electronic_receipts</text>
<text x="1053" y="548" font-family="Arial,sans-serif" font-size="15" fill="#243b53">id UUID · PK</text>
<text x="1053" y="579" font-family="Arial,sans-serif" font-size="15" fill="#243b53">sale_id · FK, NOT NULL, UNIQUE</text>
<text x="1053" y="610" font-family="Arial,sans-serif" font-size="15" fill="#243b53">receipt_number · UNIQUE</text>
<text x="1053" y="641" font-family="Arial,sans-serif" font-size="15" fill="#243b53">Cada venta tiene 0..1 comprobante</text>
<rect x="45" y="775" width="400" height="205" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="63" y="810" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">optical_prescriptions</text>
<text x="63" y="848" font-family="Arial,sans-serif" font-size="15" fill="#243b53">clinical_record_id · PK y FK</text>
<text x="63" y="879" font-family="Arial,sans-serif" font-size="15" fill="#243b53">Medidas OD / OS y tratamiento</text>
<text x="63" y="910" font-family="Arial,sans-serif" font-size="15" fill="#243b53">Cada registro tiene 0..1 receta</text>
<path d="M445,205 L540,205" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="184" font-family="Arial,sans-serif" font-size="16" fill="#243b53" font-weight="bold">1 : 0..N</text>
<path d="M940,205 L1035,205" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="940" y="184" font-family="Arial,sans-serif" font-size="16" fill="#243b53" font-weight="bold">1 : 0..1</text>
<path d="M245,315 L245,475" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="265" y="405" font-family="Arial,sans-serif" font-size="16" fill="#243b53" font-weight="bold">1 : 0..1</text>
<path d="M740,315 L740,475" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="760" y="405" font-family="Arial,sans-serif" font-size="16" fill="#243b53" font-weight="bold">1 : 0..N</text>
<path d="M1235,315 L1235,475" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="1255" y="405" font-family="Arial,sans-serif" font-size="16" fill="#243b53" font-weight="bold">1 : 0..1</text>
<path d="M45,220 L20,220 L20,875 L45,875" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="510" y="832" font-family="Arial,sans-serif" font-size="18" fill="#243b53" font-weight="bold">clinical_records 1 → 0..1 optical_prescriptions</text>
<text x="510" y="875" font-family="Arial,sans-serif" font-size="17" fill="#243b53">La disposición de la receta no indica dependencia de medical_histories.</text>
<text x="36" y="1020" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Regla: una cotización puede no tener venta o tener una sola. Una venta pertenece a exactamente una cotización.</text>
<text x="36" y="1053" font-family="Arial,sans-serif" font-size="17" fill="#243b53">Respaldo: V2__clinical_commercial_schema.sql; RegisterSaleHandler rechaza duplicados con HTTP 409.</text>
</svg>