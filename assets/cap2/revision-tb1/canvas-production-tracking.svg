<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img"><title>Bounded Context Canvas · Production &amp; Tracking</title><desc>Canvas del diseño de OptiFlow con diez dimensiones, basado en DDD Crew.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#12364a">Bounded Context Canvas · Production &amp; Tracking</text>
<rect x="36" y="85" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="119" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Purpose · Propósito</text>
<text x="56" y="157" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Coordinar la fabricación y facilitar el seguimiento de cada</text>
<text x="56" y="182" font-family="Arial,sans-serif" font-size="18" fill="#243b53">orden hasta su entrega.</text>
<rect x="736" y="85" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="119" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Strategic Classification · Clasificación</text>
<text x="756" y="157" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Core Domain; ejecución y trazabilidad de órdenes.</text>
<rect x="36" y="333" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="367" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Domain Roles · Responsabilidades</text>
<text x="56" y="405" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Gestión del flujo de taller, asignaciones y avance del pedido.</text>
<rect x="736" y="333" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="367" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Ubiquitous Language · Lenguaje</text>
<text x="756" y="405" font-family="Arial,sans-serif" font-size="18" fill="#243b53">WorkOrder: orden. Technician: técnico. Laboratory: taller.</text>
<text x="756" y="430" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Status: etapa. EstimatedDeliveryDate: fecha estimada.</text>
<rect x="36" y="581" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="615" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Business Decisions · Reglas</text>
<text x="56" y="653" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Vincular la orden con una venta cerrada. Respetar las</text>
<text x="56" y="678" font-family="Arial,sans-serif" font-size="18" fill="#243b53">transiciones válidas. Comunicar cambios sin delegar a</text>
<text x="56" y="703" font-family="Arial,sans-serif" font-size="18" fill="#243b53">notificaciones la decisión del estado.</text>
<rect x="736" y="581" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="615" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Inbound Communication · Entradas</text>
<text x="756" y="653" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Clinical &amp; Commercial: SaleWasClosed. Personal: asignación y</text>
<text x="756" y="678" font-family="Arial,sans-serif" font-size="18" fill="#243b53">cambio de estado (comandos). Paciente: consulta del pedido.</text>
<rect x="36" y="829" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="863" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Outbound Communication · Salidas</text>
<text x="56" y="901" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Consultas: estado y fecha estimada. Notification &amp; Loyalty:</text>
<text x="56" y="926" font-family="Arial,sans-serif" font-size="18" fill="#243b53">WorkOrderStatusUpdated y OrderWasMarkedAsDelivered.</text>
<rect x="736" y="829" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="863" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Assumptions · Supuestos</text>
<text x="756" y="901" font-family="Arial,sans-serif" font-size="18" fill="#243b53">El taller registra avances oportunamente. El modelo conceptual</text>
<text x="756" y="926" font-family="Arial,sans-serif" font-size="18" fill="#243b53">documental no obliga a usar MongoDB en TB1: el backend usa</text>
<text x="756" y="951" font-family="Arial,sans-serif" font-size="18" fill="#243b53">persistencia JPA.</text>
<rect x="36" y="1077" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="1111" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Verification Metrics · Verificación</text>
<text x="56" y="1149" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Verificar vínculo venta-orden y transiciones; comprobar que</text>
<text x="56" y="1174" font-family="Arial,sans-serif" font-size="18" fill="#243b53">los eventos identifican pedido, paciente y estado.</text>
<rect x="736" y="1077" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="1111" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Open Questions · Decisiones pendientes</text>
<text x="756" y="1149" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Precisar tratamiento de demoras, reapertura y cambios de</text>
<text x="756" y="1174" font-family="Arial,sans-serif" font-size="18" fill="#243b53">laboratorio. No confundir fecha estimada con garantía de</text>
<text x="756" y="1199" font-family="Arial,sans-serif" font-size="18" fill="#243b53">entrega.</text>
<text x="36" y="1350" font-family="Arial,sans-serif" font-size="16" fill="#243b53">Referencia: DDD Crew, The Bounded Context Canvas.</text>
</svg>