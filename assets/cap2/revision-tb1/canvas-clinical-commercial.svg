<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img"><title>Bounded Context Canvas · Clinical &amp; Commercial</title><desc>Canvas del diseño de OptiFlow con diez dimensiones, basado en DDD Crew.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#12364a">Bounded Context Canvas · Clinical &amp; Commercial</text>
<rect x="36" y="85" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="119" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Purpose · Propósito</text>
<text x="56" y="157" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Organizar la evaluación visual y transformar una cotización</text>
<text x="56" y="182" font-family="Arial,sans-serif" font-size="18" fill="#243b53">aprobada en una venta trazable.</text>
<rect x="736" y="85" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="119" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Strategic Classification · Clasificación</text>
<text x="756" y="157" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Core Domain; ejecución de atención y conversión comercial.</text>
<rect x="36" y="333" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="367" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Domain Roles · Responsabilidades</text>
<text x="56" y="405" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Registro clínico y control de las transiciones comerciales.</text>
<rect x="736" y="333" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="367" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Ubiquitous Language · Lenguaje</text>
<text x="756" y="405" font-family="Arial,sans-serif" font-size="18" fill="#243b53">ClinicalRecord: atención. OpticalPrescription: prescripción.</text>
<text x="756" y="430" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Quotation: propuesta económica. Sale: venta. Receipt:</text>
<text x="756" y="455" font-family="Arial,sans-serif" font-size="18" fill="#243b53">comprobante.</text>
<rect x="36" y="581" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="615" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Business Decisions · Reglas</text>
<text x="56" y="653" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Solo una cotización aprobada genera una venta; máximo una</text>
<text x="56" y="678" font-family="Arial,sans-serif" font-size="18" fill="#243b53">venta por cotización. Registrar pago antes del cierre. Cada</text>
<text x="56" y="703" font-family="Arial,sans-serif" font-size="18" fill="#243b53">venta tiene como máximo un comprobante.</text>
<rect x="736" y="581" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="615" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Inbound Communication · Entradas</text>
<text x="756" y="653" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Personal: registro clínico, cotización, aprobación, registro</text>
<text x="756" y="678" font-family="Arial,sans-serif" font-size="18" fill="#243b53">de venta y pago (comandos). Search &amp; Booking:</text>
<text x="756" y="703" font-family="Arial,sans-serif" font-size="18" fill="#243b53">AppointmentBooked.</text>
<rect x="36" y="829" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="863" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Outbound Communication · Salidas</text>
<text x="56" y="901" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Consultas: expediente, cotización y venta. Production &amp;</text>
<text x="56" y="926" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Tracking: SaleWasClosed. Inventario: integración propuesta al</text>
<text x="56" y="951" font-family="Arial,sans-serif" font-size="18" fill="#243b53">cierre.</text>
<rect x="736" y="829" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="863" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Assumptions · Supuestos</text>
<text x="756" y="901" font-family="Arial,sans-serif" font-size="18" fill="#243b53">El expediente identifica al paciente. El pago registrado no</text>
<text x="756" y="926" font-family="Arial,sans-serif" font-size="18" fill="#243b53">implica una integración bancaria externa implementada.</text>
<rect x="36" y="1077" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="56" y="1111" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Verification Metrics · Verificación</text>
<text x="56" y="1149" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Verificar rechazo de cotización no aprobada y venta duplicada;</text>
<text x="56" y="1174" font-family="Arial,sans-serif" font-size="18" fill="#243b53">comprobar UNIQUE en sales.quotation_id y vínculo del</text>
<text x="56" y="1199" font-family="Arial,sans-serif" font-size="18" fill="#243b53">comprobante.</text>
<rect x="736" y="1077" width="668" height="228" rx="8" fill="#f1f6fa" stroke="#98afbf" stroke-width="1.5"/>
<text x="756" y="1111" font-family="Arial,sans-serif" font-size="19" fill="#243b53" font-weight="bold">Open Questions · Decisiones pendientes</text>
<text x="756" y="1149" font-family="Arial,sans-serif" font-size="18" fill="#243b53">Definir revisiones de cotización y tratamiento de anulaciones.</text>
<text x="756" y="1174" font-family="Arial,sans-serif" font-size="18" fill="#243b53">TB1 no modela ventas parciales múltiples desde una misma</text>
<text x="756" y="1199" font-family="Arial,sans-serif" font-size="18" fill="#243b53">cotización.</text>
<text x="36" y="1350" font-family="Arial,sans-serif" font-size="16" fill="#243b53">Referencia: DDD Crew, The Bounded Context Canvas.</text>
</svg>