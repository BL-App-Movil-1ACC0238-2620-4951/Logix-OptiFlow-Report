<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="870" viewBox="0 0 1250 870" role="img"><title>DMF 1 · Búsqueda, disponibilidad y reserva</title><desc>Flujo de mensajes numerados con tipo, emisor, receptor y datos significativos.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#12364a">DMF 1 · Búsqueda, disponibilidad y reserva</text>
