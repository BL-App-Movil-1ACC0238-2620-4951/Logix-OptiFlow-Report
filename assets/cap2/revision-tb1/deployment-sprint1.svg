<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img"><title>C4 · Despliegue documentado del Sprint 1</title><desc>Nodos de publicación, distribución y ejecución descritos en el capítulo IV.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#12364a">C4 · Despliegue documentado del Sprint 1</text>
<rect x="40" y="95" width="610" height="275" rx="8" fill="#fff" stroke="#54849a" stroke-width="1.5"/>
<text x="60" y="131" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">GitHub Pages · Sitio estático</text>
<rect x="65" y="165" width="560" height="150" rx="8" fill="#e8f2f7" stroke="#98afbf" stroke-width="1.5"/>
<text x="85" y="199" font-family="Arial,sans-serif" font-size="20" fill="#243b53" font-weight="bold">Landing Page</text>
<text x="85" y="239" font-family="Arial,sans-serif" font-size="17" fill="#243b53">HTML / CSS / JavaScript; publicación web</text>
<rect x="750" y="95" width="610" height="275" rx="8" fill="#fff" stroke="#54849a" stroke-width="1.5"/>
<text x="770" y="131" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">Render · Servicio web</text>
<rect x="775" y="165" width="560" height="150" rx="8" fill="#e8f2f7" stroke="#98afbf" stroke-width="1.5"/>
<text x="795" y="199" font-family="Arial,sans-serif" font-size="20" fill="#243b53" font-weight="bold">Contenedor Docker</text>
<text x="795" y="239" font-family="Arial,sans-serif" font-size="17" fill="#243b53">Backend OptiFlow · Java 21 / Spring Boot</text>
<rect x="750" y="445" width="610" height="250" rx="8" fill="#fff" stroke="#54849a" stroke-width="1.5"/>
<text x="770" y="481" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">Persistencia · Nodo lógico asociado</text>
<rect x="775" y="515" width="560" height="150" rx="8" fill="#e8f2f7" stroke="#98afbf" stroke-width="1.5"/>
<text x="795" y="549" font-family="Arial,sans-serif" font-size="20" fill="#243b53" font-weight="bold">PostgreSQL</text>
<text x="795" y="589" font-family="Arial,sans-serif" font-size="17" fill="#243b53">Servicio asociado; host y credenciales definidos por</text>
<text x="795" y="613" font-family="Arial,sans-serif" font-size="17" fill="#243b53">entorno</text>
<rect x="40" y="760" width="610" height="245" rx="8" fill="#fff" stroke="#54849a" stroke-width="1.5"/>
<text x="60" y="796" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">Firebase App Distribution</text>
<rect x="65" y="830" width="560" height="150" rx="8" fill="#e8f2f7" stroke="#98afbf" stroke-width="1.5"/>
<text x="85" y="864" font-family="Arial,sans-serif" font-size="20" fill="#243b53" font-weight="bold">Distribución de la aplicación</text>
<text x="85" y="904" font-family="Arial,sans-serif" font-size="17" fill="#243b53">Archivo instalable para evaluadores; no ejecuta el</text>
<text x="85" y="928" font-family="Arial,sans-serif" font-size="17" fill="#243b53">backend</text>
<rect x="750" y="760" width="610" height="245" rx="8" fill="#fff" stroke="#54849a" stroke-width="1.5"/>
<text x="770" y="796" font-family="Arial,sans-serif" font-size="22" fill="#243b53" font-weight="bold">Dispositivo Android · Cliente</text>
<rect x="775" y="830" width="560" height="150" rx="8" fill="#e8f2f7" stroke="#98afbf" stroke-width="1.5"/>
<text x="795" y="864" font-family="Arial,sans-serif" font-size="20" fill="#243b53" font-weight="bold">Aplicación móvil instalada</text>
<text x="795" y="904" font-family="Arial,sans-serif" font-size="17" fill="#243b53">Android / Kotlin; consume el backend por HTTPS</text>
<path d="M650,885 L750,885" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="650" y="855" font-family="Arial,sans-serif" font-size="15" fill="#243b53">Instala</text>
<path d="M1070,370 L1070,445" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="1090" y="410" font-family="Arial,sans-serif" font-size="16" fill="#243b53">JPA / JDBC</text>
<path d="M750,875 L700,875 L700,275 L750,275" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="510" y="590" font-family="Arial,sans-serif" font-size="16" fill="#243b53">HTTPS / JSON</text>
<text x="36" y="1080" font-family="Arial,sans-serif" font-size="18" fill="#243b53">GitHub Pages aloja la Landing Page; Firebase distribuye el archivo móvil; Render ejecuta el único backend.</text>
<text x="36" y="1120" font-family="Arial,sans-serif" font-size="16" fill="#243b53">PostgreSQL se representa como persistencia asociada, sin afirmar que sea un proceso dentro del mismo Docker.</text>
<text x="36" y="1160" font-family="Arial,sans-serif" font-size="16" fill="#243b53">Alcance: entornos descritos en 4.2.1.8. El nodo de persistencia es lógico; su proveedor no se especifica aquí.</text>
</svg>